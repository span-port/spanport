<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$subject</title>
  </head>
  <!-- Inline styles only: Gmail and Outlook drop <style> blocks. Every value is HTML-escaped. -->
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e3e6ea;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:#12161c;padding:16px 24px;color:#ffffff;font-size:15px;font-weight:600;letter-spacing:0.02em;">Spanport</td>
            </tr>
            <tr>
              <td style="height:4px;line-height:4px;font-size:0;background:$accent;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:$accent;">$label</p>
                <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#12161c;">$heading</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">$summary</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
$rows
                </table>
                <p style="margin:20px 0 0;">$buttons</p>
                <p style="margin:12px 0 0;font-size:13px;line-height:1.5;color:#5b6573;">$footer</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#8a94a3;">Sent by Spanport alerts. Alert emails carry counts and the search, never log lines.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
