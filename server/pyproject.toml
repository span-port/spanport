[project]
name = "spanport-server"
version = "0.0.0"
description = "Spanport API server"
requires-python = ">=3.14,<3.16"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "clickhouse-connect[async]==1.11.0",
  "fastapi==0.162.0",
  "opentelemetry-proto==1.45.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn==0.54.0",
]

# Run from source (src/ on the path); the server is never published as a wheel.
[tool.uv]
package = false
